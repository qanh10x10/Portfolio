<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="dark light">
  <title>Chu Quang Anh - Unity game developer</title>
  <meta name="description" content="Game Developer specializing in Unity. Portfolio of Chu Quang Anh">
  <meta name="keywords" content="game developer, unity, gamefi, blockchain, metaverse, portfolio">
  <meta name="theme-color" content="#0d0c0b">
  <meta property="og:title" content="Chu Quang Anh - Unity game developer">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://portfolio.hollow-agent.xyz/assets/logo.png">
  <meta property="og:description" content="Chu Quang Anh builds games. Unity developer in Ha Noi. Five years building 2D and 3D games for mobile and web, including MMO client work.">
  <meta property="og:url" content="https://portfolio.hollow-agent.xyz/">
  <link rel="canonical" href="https://portfolio.hollow-agent.xyz/">
  <meta name="author" content="Chu Quang Anh">
  <meta property="og:locale" content="en_US">
  <link rel="icon" type="image/png" href="/assets/favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #0b0f17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.45s ease;
      user-select: none;
    }
    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 32px;
      border-radius: 14px;
      background: rgba(14, 21, 33, 0.72);
      border: 1px solid rgba(0, 242, 254, 0.15);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), 0 0 1px rgba(0, 242, 254, 0.2);
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      gap: 6px;
    }
    .loader-robot {
      filter: drop-shadow(0 0 14px rgba(0, 242, 254, 0.45));
      animation: loader-bob 2.2s ease-in-out infinite;
    }
    .loader-eye {
      animation: loader-blink 3s infinite;
      transform-origin: center;
    }
    .loader-name {
      color: #f0f4f8;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.16em;
      margin-top: 8px;
    }
    .loader-role {
      color: #a2b1c7;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .loader-bar-wrap {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      margin-top: 14px;
    }
    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      border-radius: 3px;
      box-shadow: 0 0 10px #00f2fe;
      transition: width 0.25s ease-out;
    }
    .loader-bar.indeterminate {
      width: 35%;
      animation: loader-slide 1.4s ease-in-out infinite alternate;
    }
    .loader-hint {
      color: #a2b1c7;
      font-size: 12px;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }
    #loader-error {
      color: #ff6b6b;
      font-size: 12px;
      letter-spacing: 0.02em;
      margin-top: 8px;
      max-width: 280px;
      line-height: 1.4;
      text-align: center;
    }
    #loader-retry {
      margin-top: 12px;
      min-height: 44px;
      padding: 10px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      font-size: 12px;
      font-family: inherit;
      color: #00f2fe;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 4px;
      cursor: pointer;
      pointer-events: auto;
    }
    #loading-screen [hidden] { display: none !important; }
    #loader-retry:hover {
      background: rgba(0, 242, 254, 0.2);
    }
    #loader-retry:focus-visible {
      outline: 2px solid #00f2fe;
      outline-offset: 2px;
    }
    @keyframes loader-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes loader-blink {
      0%, 88%, 100% { opacity: 1; transform: scaleY(1); }
      94% { opacity: 0.15; transform: scaleY(0.15); }
    }
    @keyframes loader-slide {
      0% { left: 0%; width: 25%; }
      100% { left: 75%; width: 25%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader-robot,
      .loader-eye,
      .loader-bar,
      .loader-bar.indeterminate {
        animation: none !important;
        transition: none !important;
      }
      #loading-screen {
        transition: opacity 0.05s linear, visibility 0.05s linear !important;
      }
    }
  </style>
</head>

<body>
  <div id="loading-screen" aria-live="polite" aria-label="Loading Chu Quang Anh portfolio">
    <div class="loader-content">
      <div class="loader-robot">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="8" width="36" height="30" rx="6" fill="#151d2a" stroke="#00f2fe" stroke-width="2"/>
          <rect class="loader-eye" x="14" y="18" width="6" height="7" rx="2" fill="#00f2fe"/>
          <rect class="loader-eye" x="28" y="18" width="6" height="7" rx="2" fill="#00f2fe"/>
          <line x1="24" y1="2" x2="24" y2="8" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
          <circle cx="24" cy="2" r="2.5" fill="#00f2fe"/>
        </svg>
      </div>
      <div class="loader-name">CHU QUANG ANH</div>
      <div class="loader-role">Unity Game Developer</div>
      <div class="loader-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Loading progress">
        <div class="loader-bar indeterminate"></div>
      </div>
      <div class="loader-hint">Loading 3D Workspace…</div>
      <p id="loader-error" hidden></p>
      <button id="loader-retry" type="button" hidden>Reload workspace</button>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
